org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# ---- Pinned toolchain versions (Minecraft Java Edition 26.1.2) ----
# Minecraft 26.1.2 was released 2026-04-09 and requires Java 25.
minecraft_version=26.1.2
# NeoForge build for Minecraft 26.1.2. Scheme: <mcMajor>.<mcMinor>.<mcPatch>.<neoforgeBuild>
neoforge_version=26.1.2.109

# GeckoLib 5.5.2 is the build published for Minecraft 26.1.2 on NeoForge (verified against the
# Modrinth API: 5.5.1 and 5.5.2 target 26.1.2; 5.5.3+ moved to 26.2). Note 5.x lives under the
# com.geckolib package, NOT software.bernie.geckolib as in 4.x.
geckolib_version=5.5.2
#
# The dependency is pinned by Modrinth VERSION ID, not by version number, and that is deliberate.
# SIX separate Modrinth versions are all numbered "5.5.2" - neoforge, forge and fabric builds for
# each of 26.1.2 and 26.2 - so the coordinate maven.modrinth:geckolib:5.5.2 is ambiguous. It
# resolves to the FABRIC jar, which compiles fine and then makes the game refuse to boot with
# "File mods/geckolib-5.5.2.jar is a Fabric mod and cannot be loaded". xfVfPcoC is the NeoForge
# build for 26.1.2 specifically (geckolib-neoforge-26.1.2-5.5.2.jar).
geckolib_modrinth_version_id=xfVfPcoC

mod_id=rasengan
mod_name=Rasengan
mod_version=1.4.1
mod_group_id=dev.rasengan
mod_license=MIT
mod_authors=Rasengan Mod Contributors
mod_description=Server-authoritative charged energy-sphere ability with a POWER BAR HUD and a procedural 3D animation.
