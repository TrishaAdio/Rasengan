plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.1.x runs on Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neoforge_version

    // Generates the runs and makes the decompiled sources available.
    parchment {
        // Intentionally unused: Mojang removed obfuscation in 26.1, so official
        // parameter names ship with the game. Kept empty for clarity.
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = file('run/client')
        }
        client2 {
            client()
            programArguments.addAll '--username', 'Player2'
            gameDirectory = file('run/client2')
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

// Expand the mod metadata with the gradle.properties values so versions live in one place.
final def expandProps = [
        version          : version,
        group            : project.group,
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description
]

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = expandProps
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Forward the terminal to the running game so `runServer` accepts console commands
// (e.g. `op`, `damage`, `stop`) the same way a real dedicated server does.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
