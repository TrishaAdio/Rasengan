plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.1.x runs on Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neoforge_version

    // Generates the runs and makes the decompiled sources available.
    parchment {
        // Intentionally unused: Mojang removed obfuscation in 26.1, so official
        // parameter names ship with the game. Kept empty for clarity.
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = file('run/client')
        }
        client2 {
            client()
            programArguments.addAll '--username', 'Player2'
            gameDirectory = file('run/client2')
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
            gameDirectory = file('run/server')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // GeckoLib is not published to its own maven for this Minecraft version; the artifact is
    // only available through Modrinth's maven mirror.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// Mod jars that the dev runs need in their mods folder. Kept separate from `compileOnly` below so
// the jar is resolved once and reused for both purposes.
configurations {
    runMods
}

dependencies {
    // Animation/rendering engine for the dragon. The mod had no entity-model system at all before
    // this (the only other entity is drawn procedurally through SubmitCustomGeometryEvent), so
    // nothing is being duplicated or replaced here.
    //
    // compileOnly, not implementation: GeckoLib is a separate mod that the end user installs
    // alongside this one (it is declared as a required dependency in neoforge.mods.toml), so it
    // must not be on our runtime classpath as a plain library. FML in 26.1 does not discover mods
    // from the classpath, so dev runs get it from the mods folder instead - see installRunMods.
    // Pinned by Modrinth version ID - see the note in gradle.properties. Using the version number
    // silently selects the Fabric build.
    compileOnly "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"
    runMods "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"
}

// Places mod dependencies where the mod loader actually looks during runClient / runServer.
// Without this, runServer aborts with "geckolib is not installed" even though the build compiles.
def runModDirs = ['run/server/mods', 'run/client/mods', 'run/client2/mods']
def installRunMods = tasks.register('installRunMods') {
    description = 'Copies mod dependencies into the dev run mods folders.'
    inputs.files(configurations.runMods)
    outputs.dirs(runModDirs.collect { file(it) })
    doLast {
        runModDirs.each { dir ->
            copy {
                from configurations.runMods
                into file(dir)
            }
        }
    }
}

tasks.matching { it.name in ['runServer', 'runClient', 'runClient2', 'runData'] }.configureEach {
    dependsOn installRunMods
}

// Expand the mod metadata with the gradle.properties values so versions live in one place.
final def expandProps = [
        version          : version,
        group            : project.group,
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description
]

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = expandProps
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Forward the terminal to the running game so `runServer` accepts console commands
// (e.g. `op`, `damage`, `stop`) the same way a real dedicated server does.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

// The publish guard that used to live here was removed once the dragon asset's licence was
// established as CC BY 4.0, which permits redistribution and modification. The obligation that
// replaced it is attribution, not exclusion - see DRAGON_CREDITS.md.

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
